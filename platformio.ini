[platformio]
default_envs = dashboard
boards_dir = boards

; Shared settings for ESP32 environments (NOT inherited by native test env)
[esp32]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper-S3

upload_speed = 921600
monitor_speed = 115200
monitor_filters = 
	default
	time
	esp32_exception_decoder

build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
	-DCORE_DEBUG_LEVEL=3
	-include math.h

board_build.arduino.memory_type = qio_opi
board_build.arduino.psram_type = opi
board_build.flash_mode = qio

; Auto-patch LilyGo-EPD47 font.c after lib install (skip transparent pixels)
extra_scripts = pre:patch_font_renderer.py

lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.0.4
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
	lewisxhe/SensorLib@^0.3.1

; ---------------------------------------------------------------------------
; Demo environment — UI concept work with hardcoded data, no networking.
; Select with: pio run -e demo
; ---------------------------------------------------------------------------
[env:demo]
extends = esp32
build_src_filter = +<*> -<main_dashboard.cpp> -<networking.cpp> -<dashboards/*> -<sd_storage.cpp> -<settings.cpp> -<ui_settings.cpp>
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
	-DCORE_DEBUG_LEVEL=3
	-include math.h
	-DENV_DEMO

; ---------------------------------------------------------------------------
; Dashboard environment — full MQTT + sleep + touch pipeline.
; Select with: pio run -e dashboard
; ---------------------------------------------------------------------------
[env:dashboard]
extends = esp32
build_src_filter = +<*> -<main.cpp>

; ---------------------------------------------------------------------------
; Native test environment — runs unit tests on desktop (no hardware needed)
; Run with: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags = -std=c++17 -Iinclude
test_build_src = false
